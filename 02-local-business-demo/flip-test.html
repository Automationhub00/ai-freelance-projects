<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; padding:30px 18px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:Arial,sans-serif; background:#faf5ed; color:#30251f; }
  h1 { font-family:Georgia,serif; letter-spacing:5px; margin:0 0 5px; }
  .hint { text-align:center; color:#766b61; margin:0 0 28px; }
  .flip-card { display:block; width:min(100%,340px); height:400px; perspective:1200px; border:0; border-radius:16px; background:transparent; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }

  .flip-inner { display:block; position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .72s cubic-bezier(.2,.75,.2,1); }

  .front,.back { position:absolute; inset:0; display:block; overflow:hidden; border-radius:16px; backface-visibility:hidden; -webkit-backface-visibility:hidden; box-shadow:0 12px 32px rgba(48,37,31,.18); }
  .front { background:#b68b65; }
  .front img { display:block; width:100%; height:100%; object-fit:cover; }
  .photo-label { position:absolute; inset:auto 0 0; padding:44px 16px 22px; background:linear-gradient(transparent,rgba(0,0,0,.72)); color:white; font-family:Georgia,serif; font-size:24px; font-weight:bold; }
  .back { background:#292723; color:#fffdf8; transform:rotateY(180deg); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:26px; text-align:center; }
  .eyebrow { font-size:12px; letter-spacing:2px; color:#d8b675; }
  .back h2 { font-family:Georgia,serif; font-size:30px; margin:16px 0 8px; }
  .japanese { color:#e9d4b2; font-size:16px; }
  .description { margin-top:20px; font-size:15px; line-height:1.6; }
  .price { font-size:28px; color:#d8b675; font-weight:bold; margin-top:16px; }
  .note { margin-top:8px; color:#c7b7a6; font-size:12px; }
  @media (prefers-reduced-motion:reduce) { .flip-inner { transition:none; } }
</style>
